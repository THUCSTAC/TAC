site_name: TA Competency
site_url: https://thucstac.github.io/TAC/

theme:
  name: material
  palette:
    primary: deep blue
  features:
    - navigation.indexes
    - content.code.annotate

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
      reconfigure_material: true

